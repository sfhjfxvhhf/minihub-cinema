<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Stream Cinema - MiniHub</title>
    
    <!-- Neon Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23e11d48'/%3E%3Cstop offset='100%25' stop-color='%23ff0055'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='25' fill='url(%23g)'/%3E%3Cpolygon points='38,28 75,50 38,72' fill='%23ffffff'/%3E%3C/svg%3E">

    <!-- Verifications -->
    <meta name="google-site-verification" content="cd3pGHJbUqEqBH2d1D54HpZx9ts5Ggw8N-kd1Uc9yGg" />
    <meta name="yandex-verification" content="cf34b73caf562ecd" />

    <!-- SEO & SafeSearch -->
    <meta id="metaDesc" name="description" content="Watch full HD uncensored video stream online on MiniHub.">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="rating" content="RTA-5042-1996-1400-1579-1604-AVG">
    <meta name="rating" content="adult">

    <!-- Open Graph Dynamic -->
    <meta property="og:type" content="video.other">
    <meta id="ogTitle" property="og:title" content="Stream HD Video - MiniHub">
    <meta id="ogDesc" property="og:description" content="Watch uncensored high-quality video stream on MiniHub.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS with Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .theme-transition {
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-[#050508] dark:text-gray-100 theme-transition pb-24">

    <!-- Navigation Header -->
    <header class="sticky top-0 z-50 bg-white/90 dark:bg-[#050508]/90 backdrop-blur-xl border-b border-gray-200 dark:border-[#171a24] px-3.5 lg:px-10 py-2.5 theme-transition">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-rose-600 flex items-center justify-center shadow-lg shadow-rose-600/30">
                    <svg class="w-4 h-4 text-white ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <span class="text-xl font-black">MINI<span class="text-rose-600">HUB</span></span>
            </a>

            <div class="flex items-center gap-2">
                <!-- AMOLED NIGHT SWITCH -->
                <button 
                    onclick="toggleThemeMode()" 
                    title="Toggle Theme" 
                    class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gray-200 dark:bg-[#0e111a] border border-gray-300 dark:border-[#1b1f2e] text-gray-700 dark:text-amber-400 hover:border-rose-500 transition shadow-sm"
                >
                    <span id="themeIcon">🌙</span>
                    <span id="themeLabel" class="text-[10px] font-extrabold uppercase tracking-wider hidden xs:inline">Night</span>
                </button>

                <a href="index.html" class="text-xs font-bold bg-gray-200 dark:bg-[#0e111a] hover:bg-gray-300 dark:hover:bg-[#151926] border border-gray-300 dark:border-[#1b1f2e] text-gray-800 dark:text-gray-300 px-3.5 py-1.5 rounded-xl transition">
                    ← Browse
                </a>
            </div>
        </div>
    </header>

    <!-- Main Watch Grid -->
    <main class="max-w-7xl mx-auto px-3.5 lg:px-10 mt-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left: Player Column -->
        <div class="lg:col-span-2 space-y-3.5">
            
            <!-- Video Frame with Live In-Stream Web Ad Engine -->
            <div class="w-full aspect-video bg-black rounded-2xl overflow-hidden border border-gray-300 dark:border-[#171a24] shadow-2xl relative">
                
                <!-- Main Protected Video (Download Blocked via controlsList) -->
                <video 
                    id="mainPlayer" 
                    controls 
                    controlsList="nodownload" 
                    playsinline 
                    class="w-full h-full object-contain"
                ></video>

                <!-- YouTube-Style Live Web In-Stream Ad Layer -->
                <div id="adLayer" class="absolute inset-0 z-30 bg-black hidden">
                    
                    <iframe 
                        id="adIframe" 
                        src="about:blank" 
                        class="w-full h-full border-0 absolute inset-0 z-10 bg-white"
                        sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
                    ></iframe>

                    <div class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-3 md:p-5">
                        <div class="flex items-center justify-between pointer-events-auto">
                            <div class="flex items-center gap-2 bg-black/85 backdrop-blur px-3 py-1.5 rounded-lg border border-white/10 shadow">
                                <span class="bg-yellow-400 text-black text-[10px] font-black px-1.5 py-0.5 rounded">Ad</span>
                                <span class="text-xs font-bold text-white">Sponsored &bull; (0:<span id="adTimerText">12</span>)</span>
                            </div>
                            <button onclick="openAdExternal()" class="text-xs font-bold bg-black/85 hover:bg-black border border-white/20 px-3.5 py-1.5 rounded-lg text-rose-400 hover:text-white transition shadow">
                                Visit Site ↗
                            </button>
                        </div>

                        <!-- YouTube-Style Skip Button -->
                        <div class="flex justify-end pointer-events-auto">
                            <button id="skipBtn" disabled class="bg-black/90 border border-white/20 text-gray-400 font-bold text-xs px-5 py-2.5 rounded-xl cursor-not-allowed shadow-2xl backdrop-blur">
                                Skip Ad in <span id="skipCount">6</span>s
                            </button>
                        </div>
                    </div>

                </div>

            </div>

            <!-- Video Info & Viral Share Bar -->
            <div class="bg-white dark:bg-[#0c0e14] border border-gray-200 dark:border-[#171a24] p-4 sm:p-5 rounded-2xl shadow-sm theme-transition">
                <h1 id="videoTitle" class="text-base sm:text-lg md:text-xl font-black text-gray-900 dark:text-white leading-snug">Loading stream...</h1>
                
                <div class="flex flex-wrap items-center justify-between gap-3 mt-3.5 pt-3.5 border-t border-gray-100 dark:border-[#171a24]">
                    <div class="flex items-center gap-2.5">
                        <span id="videoCategory" class="text-xs font-bold bg-gray-100 dark:bg-[#151926] text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-[#171a24] px-3 py-1 rounded-lg uppercase tracking-wider">Category</span>
                        <span class="text-xs text-gray-500 font-medium">👁️ <span id="viewCount">0</span> Views</span>
                    </div>
                    
                    <div class="flex items-center gap-2.5">
                        <button id="likeBtn" onclick="handleLike()" class="flex items-center gap-1.5 bg-gray-100 dark:bg-[#151926] hover:bg-gray-200 dark:hover:bg-[#1e2335] border border-gray-300 dark:border-[#171a24] text-gray-800 dark:text-gray-200 px-4 py-2 rounded-xl text-xs font-bold transition">
                            <span id="likeIcon">❤️</span>
                            <span id="likeCount">0</span>
                        </button>

                        <button onclick="handleViralShare()" class="flex items-center gap-1.5 bg-rose-600 hover:bg-rose-700 text-white px-5 py-2 rounded-xl text-xs font-extrabold shadow-lg shadow-rose-600/30 transition">
                            <span>🚀 Viral Share</span>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Right: Algorithmic Up Next Queue -->
        <div class="lg:col-span-1 space-y-3">
            <div class="flex items-center justify-between">
                <h3 class="text-xs font-extrabold text-gray-500 uppercase tracking-wider">Up Next For You</h3>
                <span class="text-[10px] font-bold text-rose-500 bg-rose-500/10 border border-rose-500/30 px-2 py-0.5 rounded-full">● Auto-Play</span>
            </div>
            
            <div id="upNextList" class="flex flex-col gap-2.5">
                <p class="text-xs text-gray-500 py-3">Loading suggestions...</p>
            </div>
        </div>

    </main>

    <!-- Toast Alert -->
    <div id="toast" class="fixed bottom-6 right-6 bg-rose-600 text-white text-xs font-bold px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50">
        Copied!
    </div>

    <script>
        // ==========================================================
        // 1. Stealth Obfuscated Credentials
        // ==========================================================
        const _k0 = "aHR0cHM6Ly9hcGV1dXpoZmpxcm1yZXN1b3JsdS5zdXBhYmFzZS5jbw==";
        const _k1 = "c2JfcHVibGlzaGFibGVfN3lBUG52MW94Z3prMzNyTFhMTFZmQV9oZ0I3N28yaQ==";
        const _ad0 = "aHR0cHM6Ly93d3cucHJvZml0YWJsZXJhdGVjcG1uZXR3b3JrLmNvbS9tYXVyaTZlMWY3P2tleT0zZjBmZDc0YzlmM2JmNTRlNjI2YzQ2ZjU3ZjAwMTQ3Nw==";

        const _d = (s) => atob(s);
        const supabaseClient = window.supabase.createClient(_d(_k0), _d(_k1));

        const currentVideoId = parseInt(new URLSearchParams(window.location.search).get('id'));
        let dynamicAdLink = _d(_ad0);
        let currentVideo = null;
        let nextVideoId = null;

        // Anti-Inspect Security
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c' || e.key === 'i'))) {
                e.preventDefault();
            }
        });

        // Theme Toggle
        function initTheme() {
            const savedTheme = localStorage.getItem('theme_mode') || 'dark';
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');

            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                icon.innerText = '☀️';
                label.innerText = 'Light';
            } else {
                document.documentElement.classList.add('dark');
                icon.innerText = '🌙';
                label.innerText = 'Night';
            }
        }

        function toggleThemeMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme_mode', isDark ? 'dark' : 'light');
            initTheme();
        }

        // ==========================================================
        // 2. Google AI & VideoObject Schema Injector
        // ==========================================================
        function injectVideoSchema(video) {
            const schemaData = {
                "@context": "https://schema.org",
                "@type": "VideoObject",
                "name": video.title,
                "description": `${video.title} - Stream exclusive uncensored 18+ adult cinema in Ultra HD online on MiniHub.`,
                "thumbnailUrl": [video.thumbnail_url || (video.video_url + "#t=1.0")],
                "uploadDate": video.created_at || new Date().toISOString(),
                "contentUrl": video.video_url,
                "embedUrl": window.location.href,
                "interactionStatistic": {
                    "@type": "InteractionCounter",
                    "interactionType": { "@type": "WatchAction" },
                    "userInteractionCount": (video.views || 0) + 1
                }
            };

            const scriptTag = document.createElement('script');
            scriptTag.type = 'application/ld+json';
            scriptTag.text = JSON.stringify(schemaData);
            document.head.appendChild(scriptTag);

            document.getElementById('metaDesc').content = `Watch ${video.title} in Ultra HD on MiniHub.`;
            document.getElementById('ogTitle').content = `${video.title} - MiniHub Cinema`;
            document.getElementById('ogDesc').content = `Stream ${video.title} uncensored.`;
        }

        // ==========================================================
        // 3. Load Watch Page Video
        // ==========================================================
        async function loadWatchPage() {
            if (!currentVideoId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const { data: adData } = await supabaseClient
                    .from('site_settings')
                    .select('value')
                    .eq('key', 'adsterra_link')
                    .single();
                if (adData && adData.value) dynamicAdLink = adData.value;
            } catch(e) {}

            try {
                const { data, error } = await supabaseClient
                    .from('videos')
                    .select('*')
                    .eq('id', currentVideoId)
                    .single();

                if (error || !data) throw new Error("Video not found");
                currentVideo = data;

                const mainPlayer = document.getElementById('mainPlayer');
                mainPlayer.src = currentVideo.video_url;
                document.getElementById('videoTitle').innerText = currentVideo.title;
                document.getElementById('videoCategory').innerText = currentVideo.category || 'General';
                document.getElementById('likeCount').innerText = currentVideo.likes || 0;
                document.getElementById('viewCount').innerText = (currentVideo.views || 0) + 1;
                document.title = `${currentVideo.title} - MiniHub 18+`;

                injectVideoSchema(currentVideo);

                supabaseClient.rpc('increment_view', { video_id: currentVideoId }).then();
                const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
                supabaseClient.from('security_analytics').insert([{ 
                    event_type: 'watch', 
                    video_id: currentVideoId,
                    device: isMobile ? 'Mobile 📱' : 'Desktop 💻',
                    user_agent: navigator.userAgent,
                    referrer: document.referrer || 'Direct Search',
                    hour_of_day: new Date().getHours()
                }]).then();

                mainPlayer.onended = () => {
                    if (nextVideoId) window.location.href = `watch.html?id=${nextVideoId}`;
                };

                checkLikeState();
                loadUpNextQueue();

                handleInStreamAd();

            } catch (err) {
                console.error(err);
                document.getElementById('videoTitle').innerText = "Video unavailable or deleted.";
            }
        }

        // ==========================================================
        // 4. In-Stream Live Web Ad Engine
        // ==========================================================
        function handleInStreamAd() {
            const hasWatchedBefore = localStorage.getItem('has_watched_before');
            const mainPlayer = document.getElementById('mainPlayer');

            if (!hasWatchedBefore) {
                localStorage.setItem('has_watched_before', 'true');
                mainPlayer.play().catch(() => {});
            } else {
                startAdOverlay();
            }
        }

        function startAdOverlay() {
            const adLayer = document.getElementById('adLayer');
            const adIframe = document.getElementById('adIframe');
            const mainPlayer = document.getElementById('mainPlayer');
            const skipBtn = document.getElementById('skipBtn');
            const skipCount = document.getElementById('skipCount');
            const adTimerText = document.getElementById('adTimerText');

            mainPlayer.pause();
            adLayer.classList.remove('hidden');
            adIframe.src = dynamicAdLink;

            let adDuration = 12;
            let skipDelay = 6;

            const timer = setInterval(() => {
                adDuration--;
                adTimerText.innerText = adDuration < 10 ? '0' + adDuration : adDuration;

                if (skipDelay > 1) {
                    skipDelay--;
                    skipCount.innerText = skipDelay;
                } else if (skipDelay === 1) {
                    skipDelay = 0;
                    skipBtn.disabled = false;
                    skipBtn.className = "bg-rose-600 hover:bg-rose-700 text-white font-black text-xs px-6 py-2.5 rounded-xl shadow-2xl cursor-pointer flex items-center gap-1.5 transition";
                    skipBtn.innerHTML = "Skip Ad ⏭";
                    skipBtn.onclick = closeAd;
                }

                if (adDuration <= 0) {
                    clearInterval(timer);
                    closeAd();
                }
            }, 1000);

            function closeAd() {
                clearInterval(timer);
                adIframe.src = "about:blank";
                adLayer.classList.add('hidden');
                mainPlayer.play().catch(() => {});
            }
        }

        function openAdExternal() {
            window.open(dynamicAdLink, '_blank');
        }

        // ==========================================================
        // 5. Viral Social Share Format
        // ==========================================================
        async function handleViralShare() {
            const shareUrl = window.location.href;
            const viralMessage = `🔥 ${currentVideo ? currentVideo.title : 'Unrated Exclusive Video'} 💦🫵👇\n${shareUrl}\n\nWatch till the end, what comes next is even more shocking! 😱🔞`;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: currentVideo ? currentVideo.title : 'MiniHub Cinema',
                        text: viralMessage,
                        url: shareUrl
                    });
                } catch(e) {}
            } else {
                navigator.clipboard.writeText(viralMessage);
                showToast("🔥 Viral share hook copied to clipboard!");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Like System
        function checkLikeState() {
            if (localStorage.getItem('liked_' + currentVideoId)) {
                document.getElementById('likeBtn').classList.add('text-rose-500', 'border-rose-500/50');
            }
        }

        async function handleLike() {
            if (localStorage.getItem('liked_' + currentVideoId)) {
                showToast("Already liked!");
                return;
            }
            await supabaseClient.rpc('increment_like', { video_id: currentVideoId });
            const el = document.getElementById('likeCount');
            el.innerText = parseInt(el.innerText) + 1;
            localStorage.setItem('liked_' + currentVideoId, 'true');
            checkLikeState();
            showToast("Liked!");
        }

        // ==========================================================
        // 6. Up Next Queue
        // ==========================================================
        async function loadUpNextQueue() {
            const list = document.getElementById('upNextList');
            const { data } = await supabaseClient
                .from('videos')
                .select('*')
                .neq('id', currentVideoId)
                .limit(8);

            if (!data || data.length === 0) {
                list.innerHTML = '<p class="text-xs text-gray-500 py-3">No further videos.</p>';
                return;
            }

            nextVideoId = data[0].id;
            list.innerHTML = data.map(v => {
                const hasCustomThumb = v.thumbnail_url && v.thumbnail_url.trim() !== '';

                return `
                    <div onclick="window.location.href='watch.html?id=${v.id}'" class="flex gap-3 bg-white dark:bg-[#0c0e14] hover:bg-gray-100 dark:hover:bg-[#151926] p-2.5 rounded-xl cursor-pointer border border-gray-200 dark:border-[#171a24] transition group shadow-sm">
                        <div class="w-28 aspect-video bg-black rounded-lg overflow-hidden shrink-0 relative">
                            ${hasCustomThumb ? `
                                <img src="${v.thumbnail_url}" class="w-full h-full object-cover">
                            ` : `
                                <div class="w-full h-full flex items-center justify-center bg-zinc-900 text-rose-500 text-xs font-bold">18+ HD</div>
                            `}
                        </div>
                        <div class="flex flex-col justify-center">
                            <h4 class="text-xs font-bold text-gray-800 dark:text-gray-200 group-hover:text-rose-500 line-clamp-2 leading-snug">${v.title}</h4>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-wider">${v.category || 'General'}</span>
                                <span class="text-[9px] text-gray-400">👁️ ${v.views || 0}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        initTheme();
        loadWatchPage();
    </script>
</body>
</html>
