        // Anti-Inspect Security

        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c' || e.key === 'i'))) {

        // 2. হ্যাকার ট্রল ট্র্যাপ (অন্য ডোমেইনে কোড চুরি করলেই গান ও ট্রল চালু হবে)
        // ==========================================================
        (function() {

                        </div>
                    </div>

                // আপনার দেওয়া গানের লিঙ্কটি ব্যাকগ্রাউন্ডে বেজে উঠবে
                const trollAudio = new Audio('https://files.catbox.moe/yvrn6u.m4a');
                trollAudio.loop = true;
                trollAudio.play().catch(() => {});

                if ('speechSynthesis' in window) {
                    const msg = new SpeechSynthesisUtterance("আরে শালা ছ্যাঁচড়া হ্যাকার! ধরা খাইয়া গেলি তো! বাপের লগে চালাকি করিস না!");

        // ==========================================================
        function toggleBGM() {
            const audio = document.getElementById('siteBGM');
            const btnText = document.getElementById('bgmText');
            const icon = document.getElementById('bgmIcon');

            if (audio.paused) {
                audio.play().then(() => {
                    btnText.innerText = "Music: ON";
                    icon.innerText = "🔊";
                }).catch(() => {});
            } else {
                audio.pause();
                btnText.innerText = "Music: OFF";
                icon.innerText = "🎵";
            }
        }

        // ==========================================================
        // 4. AMOLED Theme Controller
        // ==========================================================
        function initTheme() {
            const savedTheme = localStorage.getItem('theme_mode') || 'dark';
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');

            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                icon.innerText = '☀️';
                label.innerText = 'Light';
            } else {
                document.documentElement.classList.add('dark');
                icon.innerText = '🌙';
                label.innerText = 'Night';
            }
        }

        function toggleThemeMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme_mode', isDark ? 'dark' : 'light');
            initTheme();
        }

        // ==========================================================
        // 5. YouTube/TikTok-Style Recommendation Algorithm
        // ==========================================================
        function runRecommendationEngine(videos) {
            let interests = {};
            try { interests = JSON.parse(localStorage.getItem('user_interests')) || {}; } catch(e) {}

            return [...videos].sort((a, b) => {
                const aCat = interests[a.category] || 0;
                const bCat = interests[b.category] || 0;
                const scoreA = (aCat * 3.5) + ((a.views || 0) * 0.05) + ((a.likes || 0) * 0.2) + (Math.random() * 4);
                const scoreB = (bCat * 3.5) + ((b.views || 0) * 0.05) + ((b.likes || 0) * 0.2) + (Math.random() * 4);
                return scoreB - scoreA;
            });
        }

        // Skeleton Shimmer Loading
        function renderSkeletons() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = Array.from({ length: 8 }).map(() => `
                <div class="bg-gray-200 dark:bg-[#0c0e14] rounded-2xl overflow-hidden border border-gray-300 dark:border-[#171a24] p-3 space-y-3">
                    <div class="w-full aspect-video rounded-xl skeleton"></div>
                    <div class="h-4 w-3/4 rounded skeleton"></div>
                    <div class="flex justify-between items-center pt-1">
                        <div class="h-3 w-1/4 rounded skeleton"></div>
                        <div class="h-3 w-1/4 rounded skeleton"></div>
                    </div>
                </div>
            `).join('');
        }

        // Fetch Videos
        async function fetchVideos(isInitial = false) {
            if (isInitial) {
                currentPage = 0;
                rawVideoStore = [];
                renderSkeletons();
            }

            const from = currentPage * PAGE_SIZE;
            const to = from + PAGE_SIZE - 1;

            try {
                const { data, error } = await supabaseClient
                    .from('videos')
                    .select('*')
                    .order('id', { ascending: false })
                    .range(from, to);

                if (error) throw error;
                const newVideos = data || [];

                if (isInitial) rawVideoStore = newVideos;
                else rawVideoStore = [...rawVideoStore, ...newVideos];

                algorithmicFeed = runRecommendationEngine(rawVideoStore);
                renderVideoCards(algorithmicFeed);

                const btn = document.getElementById('loadMoreBtn');
                if (newVideos.length === PAGE_SIZE) btn.classList.remove('hidden');
                else btn.classList.add('hidden');

            } catch (err) {
                console.error(err);
                if (isInitial) {
                    document.getElementById('videoGrid').innerHTML = '<p class="col-span-full text-center py-16 text-rose-500 text-xs">Failed to load feed.</p>';
                }
            }
        }

        function loadMoreVideos() {
            currentPage++;
            fetchVideos(false);
        }

        // ==========================================================
        // 6. মাখনের মতো মসৃণ থাম্বনেইল ও ৩ সেকেন্ডের প্রিভিউ কার্ড
        // ==========================================================

            const grid = document.getElementById('videoGrid');
            if (!videos || videos.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-16 text-gray-500 text-xs">No videos found.</p>';

                         onmouseenter="start3sPreview(${video.id}, '${video.video_url}')"
                         onmouseleave="stop3sPreview(${video.id})"
                         ontouchstart="handleTouch3sPreview(${video.id}, '${video.video_url}')"
                         onclick="openWatchPage(${video.id}, '${video.category}')">
                        
                        <!-- Smooth Video Frame Container -->

                            <!-- Static Poster (Smooth Transition) -->

                                    </div>
                                `}

                                id="preview-${video.id}" 
                                muted 
                                playsinline 
                                preload="none"

        }

        // ==========================================================
        // 7. ৩ সেকেন্ডের মাখনের মতো প্রিভিউ ইঞ্জিন
        // ==========================================================
        function start3sPreview(id, videoUrl) {
            const video = document.getElementById(`preview-${id}`);
            const poster = document.getElementById(`poster-${id}`);
            const badge = document.getElementById(`badge-${id}`);
            if (!video) return;

            if (badge) badge.classList.remove('hidden');
            if (!video.src || video.src === window.location.href) {
                video.src = videoUrl;
            }

            video.currentTime = 0;
            video.play().then(() => {
                video.classList.remove('opacity-0'); // স্মুথ ফেড ইন
            }).catch(() => {});

            // 🔥 ১২ সেকেন্ডের বদলে ঠিক ৩ সেকেন্ড পর পুনরায় লুপ করবে
            video.ontimeupdate = () => {
                if (video.currentTime >= 3) {
                    video.currentTime = 0;
                }
            };
        }

        function stop3sPreview(id) {
            const video = document.getElementById(`preview-${id}`);
            const badge = document.getElementById(`badge-${id}`);
            if (!video) return;

            if (badge) badge.classList.add('hidden');
            video.classList.add('opacity-0'); // স্মুথ ফেড আউট
            video.pause();
            video.currentTime = 0;
        }

        let touchTimeout = null;
        function handleTouch3sPreview(id, videoUrl) {
            start3sPreview(id, videoUrl);
            clearTimeout(touchTimeout);
            touchTimeout = setTimeout(() => stop3sPreview(id), 3000); // ৩ সেকেন্ড পর থামবে
        }

        // Navigation
        function openWatchPage(id, category) {
            try {
                let interests = JSON.parse(localStorage.getItem('user_interests')) || {};
                interests[category] = (interests[category] || 0) + 1;
                localStorage.setItem('user_interests', JSON.stringify(interests));
            } catch(e) {}

            try { if (dynamicAdLink) window.open(dynamicAdLink, '_blank'); } catch(e) {}
            window.location.href = `watch.html?id=${id}`;
        }

        function handleLiveSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderVideoCards(rawVideoStore.filter(v => v.title.toLowerCase().includes(q)));
        }

        function filterVideos(cat, btn) {
            document.querySelectorAll('.cat-pill').forEach(b => {
                b.className = 'cat-pill bg-gray-200 dark:bg-[#0e111a] text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-[#1b1f2e] px-4 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition';
            });
            btn.className = 'cat-pill active bg-rose-600 text-white px-4 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap shadow-md shadow-rose-600/30 transition';

            if (cat === 'all') renderVideoCards(algorithmicFeed);
            else renderVideoCards(rawVideoStore.filter(v => (v.category || '').toLowerCase() === cat.toLowerCase()));
        }

        async function fetchAdSettings() {
            try {
                const { data } = await supabaseClient.from('site_settings').select('value').eq('key', 'adsterra_link').single();
                if (data && data.value) dynamicAdLink = data.value;
            } catch(e) {}
        }

        initTheme();
        fetchAdSettings();
        fetchVideos(true);
    </script>
</body>
</html>
