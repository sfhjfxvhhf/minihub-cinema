<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MiniHub - Ultra Fast 18+ Cinema</title>
    
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background-color: #07080b;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .glass-header {
            background: rgba(7, 8, 11, 0.9);
            backdrop-filter: blur(12px);
        }
        .card-zoom {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card-zoom:hover, .card-zoom.active-preview {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 25px -5px rgba(225, 29, 72, 0.4);
            border-color: rgba(225, 29, 72, 0.6) !important;
        }
    </style>
</head>
<body class="selection:bg-rose-600 selection:text-white pb-24">

    <!-- Top Ribbon -->
    <div class="bg-gradient-to-r from-red-950 via-rose-600 to-black text-[10px] font-black tracking-widest text-center py-1 uppercase text-white/95 border-b border-rose-800/40">
        🔞 18+ UNRATED &bull; LIGHTNING FAST STREAMING &bull; ULTRA HD
    </div>

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 glass-header border-b border-[#1b1e28] px-4 lg:px-10 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <a href="index.html" class="flex items-center gap-2 shrink-0">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-600 to-red-500 flex items-center justify-center shadow-lg shadow-rose-600/30">
                    <svg class="w-5 h-5 text-white ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <div>
                    <span class="text-xl font-black text-white leading-none tracking-tight">MINI<span class="text-rose-500">HUB</span></span>
                    <span class="block text-[8px] font-bold uppercase tracking-widest text-rose-400">FAST CINEMA</span>
                </div>
            </a>

            <!-- Search Bar -->
            <div class="relative flex-1 max-w-md hidden sm:block">
                <input 
                    type="text" 
                    id="searchInput" 
                    oninput="handleSearch()" 
                    placeholder="Search videos instantly..." 
                    class="w-full bg-[#12141c] border border-[#1b1e28] focus:border-rose-500 text-xs rounded-full pl-9 pr-4 py-2 outline-none transition text-white placeholder-gray-500"
                >
                <svg class="w-3.5 h-3.5 text-gray-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>

            <!-- Category Fast Refresh -->
            <button onclick="refreshFeed()" class="flex items-center gap-1.5 text-xs font-bold bg-[#12141c] hover:bg-[#1a1e2a] border border-[#1b1e28] text-gray-300 px-3.5 py-1.5 rounded-xl transition">
                <svg class="w-3.5 h-3.5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Refresh
            </button>
        </div>
    </header>

    <!-- Categories Filters -->
    <section class="max-w-7xl mx-auto px-4 lg:px-10 mt-4">
        <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
            <button onclick="filterVideos('all', this)" class="cat-pill active bg-rose-600 text-white px-4 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap shadow transition">All</button>
            <button onclick="filterVideos('18+', this)" class="cat-pill bg-[#12141c] hover:bg-[#1a1e2a] border border-[#1b1e28] text-gray-300 px-4 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition">🔥 18+ Unrated</button>
            <button onclick="filterVideos('entertainment', this)" class="cat-pill bg-[#12141c] hover:bg-[#1a1e2a] border border-[#1b1e28] text-gray-300 px-4 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition">Entertainment</button>
            <button onclick="filterVideos('news', this)" class="cat-pill bg-[#12141c] hover:bg-[#1a1e2a] border border-[#1b1e28] text-gray-300 px-4 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition">News & Leaks</button>
        </div>
    </section>

    <!-- Main Fast Video Grid -->
    <main class="max-w-7xl mx-auto px-4 lg:px-10 mt-4">
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            <!-- Loading Indicator -->
            <div class="col-span-full py-20 text-center">
                <div class="w-8 h-8 border-4 border-rose-500/20 border-t-rose-600 rounded-full animate-spin mx-auto mb-2"></div>
                <p class="text-xs text-gray-400">Loading videos fast...</p>
            </div>
        </div>

        <!-- Load More Button (Pagination) -->
        <div class="text-center mt-10">
            <button id="loadMoreBtn" onclick="loadMoreVideos()" class="hidden bg-[#12141c] hover:bg-rose-600 text-gray-300 hover:text-white border border-[#1b1e28] font-bold text-xs px-8 py-3 rounded-2xl transition shadow-lg">
                Load More Videos ▾
            </button>
        </div>
    </main>

    <script>
        // ==========================================================
        // 1. Configurations & Security
        // ==========================================================
        const SUPABASE_URL = "https://apeuuzhfjqrmresuorlu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_7yAPnv1oxgzk33rLXLLVfA_hgB77o2i";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let dynamicAdLink = "https://www.profitableratecpmnetwork.com/mauri6e1f7?key=3f0fd74c9f3bf54e626c46f57f001477";
        let allLoadedVideos = [];
        let currentPage = 0;
        const PAGE_SIZE = 12; // প্রতিবারে মাত্র ১২টি করে ভিডিও লোড হবে

        // Anti-Inspect
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c'))) e.preventDefault();
        });

        // Fast Analytics Logging (Async)
        setTimeout(() => {
            try {
                const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
                supabaseClient.from('analytics').insert([{ event_type: 'visit', device: isMobile ? 'Mobile 📱' : 'Desktop 💻' }]).then();
            } catch(e) {}
        }, 1000);

        // Fetch Dynamic Ads
        async function loadAdLink() {
            try {
                const { data } = await supabaseClient.from('site_settings').select('value').eq('key', 'adsterra_link').single();
                if (data && data.value) dynamicAdLink = data.value;
            } catch(e) {}
        }

        // ==========================================================
        // 2. High-Speed Paginated Video Fetching
        // ==========================================================
        async function fetchVideos(isInitial = false) {
            if (isInitial) {
                currentPage = 0;
                allLoadedVideos = [];
                document.getElementById('videoGrid').innerHTML = '<div class="col-span-full py-16 text-center"><div class="w-7 h-7 border-3 border-rose-500/20 border-t-rose-600 rounded-full animate-spin mx-auto mb-2"></div><p class="text-xs text-gray-400">Loading videos...</p></div>';
            }

            const from = currentPage * PAGE_SIZE;
            const to = from + PAGE_SIZE - 1;

            try {
                const { data, error } = await supabaseClient
                    .from('videos')
                    .select('*')
                    .order('id', { ascending: false })
                    .range(from, to);

                if (error) throw error;

                const newVideos = data || [];
                if (isInitial) {
                    allLoadedVideos = newVideos;
                } else {
                    allLoadedVideos = [...allLoadedVideos, ...newVideos];
                }

                renderVideos(allLoadedVideos);

                // Load More বাটন কন্ট্রোল
                const btn = document.getElementById('loadMoreBtn');
                if (newVideos.length === PAGE_SIZE) {
                    btn.classList.remove('hidden');
                } else {
                    btn.classList.add('hidden');
                }

            } catch (err) {
                console.error(err);
                if (isInitial) {
                    document.getElementById('videoGrid').innerHTML = '<p class="col-span-full text-center py-16 text-rose-500 text-xs">Failed to load videos. Check connection.</p>';
                }
            }
        }

        function loadMoreVideos() {
            currentPage++;
            fetchVideos(false);
        }

        // ==========================================================
        // 3. Ultra-Lightweight Zero-Bandwidth Card Rendering
        // ==========================================================
        function renderVideos(videos) {
            const grid = document.getElementById('videoGrid');
            if (!videos || videos.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-16 text-gray-500 text-xs">No videos found.</p>';
                return;
            }

            grid.innerHTML = videos.map(video => {
                const hasThumb = video.thumbnail_url && video.thumbnail_url.trim() !== '';

                return `
                    <div id="card-${video.id}" 
                         class="video-card card-zoom bg-[#111217] rounded-2xl overflow-hidden border border-[#1b1e28] flex flex-col justify-between cursor-pointer"
                         onmouseenter="startOnDemandPreview(${video.id}, '${video.video_url}')"
                         onmouseleave="stopOnDemandPreview(${video.id})"
                         ontouchstart="handleTouchPreview(${video.id}, '${video.video_url}')"
                         onclick="openWatch(${video.id}, '${video.category}')">
                        
                        <!-- Video Frame (Zero Network Request until Hover/Touch) -->
                        <div class="relative w-full aspect-video bg-[#0a0b10] overflow-hidden">
                            
                            <!-- Static Poster (Uses 0 MB Video Data) -->
                            <div id="poster-${video.id}" class="w-full h-full flex items-center justify-center bg-gradient-to-tr from-black via-[#141620] to-black">
                                ${hasThumb ? `
                                    <img src="${video.thumbnail_url}" loading="lazy" class="w-full h-full object-cover">
                                ` : `
                                    <div class="flex flex-col items-center justify-center text-gray-600 gap-1">
                                        <div class="w-10 h-10 rounded-full bg-rose-600/10 border border-rose-500/20 flex items-center justify-center text-rose-500">
                                            <svg class="w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                        </div>
                                        <span class="text-[9px] font-bold uppercase tracking-widest text-gray-500">Tap to Preview</span>
                                    </div>
                                `}
                            </div>

                            <!-- On-Demand Video Engine: src IS EMPTY INITIALLY -->
                            <video 
                                id="preview-${video.id}" 
                                muted 
                                playsinline 
                                preload="none"
                                class="hidden w-full h-full object-cover pointer-events-none"
                            ></video>

                            <!-- Badge -->
                            <div class="absolute top-2.5 left-2.5 bg-black/80 backdrop-blur px-2 py-0.5 rounded text-[8px] font-black text-rose-400 uppercase border border-rose-500/20">
                                ${(video.category || '').toLowerCase() === '18+' ? '18+ RAW' : 'HD'}
                            </div>

                            <div id="badge-${video.id}" class="hidden absolute bottom-2 right-2 flex items-center gap-1.5 bg-black/80 backdrop-blur px-2 py-0.5 rounded border border-white/10">
                                <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span>
                                <span class="text-[8px] font-bold text-white uppercase">Previewing</span>
                            </div>
                        </div>

                        <!-- Card Info -->
                        <div class="p-3.5 flex flex-col justify-between flex-grow">
                            <h3 class="text-xs font-bold text-gray-200 line-clamp-2 leading-snug hover:text-rose-400 transition">${video.title}</h3>
                            
                            <div class="flex items-center justify-between mt-2.5 pt-2.5 border-t border-[#1b1e28] text-[11px] text-gray-400">
                                <span class="text-[9px] font-bold bg-[#181a24] text-gray-300 px-2 py-0.5 rounded uppercase tracking-wider">${video.category || 'General'}</span>
                                <div class="flex items-center gap-2 text-[10px] font-medium">
                                    <span>👁️ ${video.views || 0}</span>
                                    <span class="text-rose-500">❤️ ${video.likes || 0}</span>
                                </div>
                            </div>
                        </div>

                    </div>
                `;
            }).join('');
        }

        // ==========================================================
        // 4. On-Demand Preview Engine (Loads ONLY when Touched/Hovered)
        // ==========================================================
        function startOnDemandPreview(id, videoUrl) {
            const card = document.getElementById(`card-${id}`);
            const video = document.getElementById(`preview-${id}`);
            const poster = document.getElementById(`poster-${id}`);
            const badge = document.getElementById(`badge-${id}`);

            if (!card || !video) return;

            card.classList.add('active-preview');
            badge.classList.remove('hidden');

            // লোড হওয়ার আগে পর্যন্ত ভিডিও কলই হবে না (জিরো ব্যান্ডউইথ খরচ)
            if (!video.src || video.src === window.location.href) {
                video.src = videoUrl;
            }

            video.classList.remove('hidden');
            poster.classList.add('hidden');

            video.currentTime = 0;
            video.play().catch(() => {});
            video.ontimeupdate = () => {
                if (video.currentTime >= 12) video.currentTime = 0;
            };
        }

        function stopOnDemandPreview(id) {
            const card = document.getElementById(`card-${id}`);
            const video = document.getElementById(`preview-${id}`);
            const poster = document.getElementById(`poster-${id}`);
            const badge = document.getElementById(`badge-${id}`);

            if (!card || !video) return;

            card.classList.remove('active-preview');
            badge.classList.add('hidden');

            video.pause();
            video.currentTime = 0;
            video.classList.add('hidden');
            poster.classList.remove('hidden');
        }

        let touchTimeout = null;
        function handleTouchPreview(id, videoUrl) {
            startOnDemandPreview(id, videoUrl);
            clearTimeout(touchTimeout);
            touchTimeout = setTimeout(() => stopOnDemandPreview(id), 12000);
        }

        // ==========================================================
        // 5. Open Watch Page + Ad
        // ==========================================================
        function openWatch(id, category) {
            // Track preference
            try {
                let userInterests = JSON.parse(localStorage.getItem('user_interests')) || {};
                userInterests[category] = (userInterests[category] || 0) + 1;
                localStorage.setItem('user_interests', JSON.stringify(userInterests));
            } catch(e) {}

            try {
                if (dynamicAdLink) window.open(dynamicAdLink, '_blank');
            } catch(e) {}

            window.location.href = `watch.html?id=${id}`;
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderVideos(allLoadedVideos.filter(v => v.title.toLowerCase().includes(q)));
        }

        function filterVideos(cat, btn) {
            document.querySelectorAll('.cat-pill').forEach(b => {
                b.className = 'cat-pill bg-[#12141c] hover:bg-[#1a1e2a] border border-[#1b1e28] text-gray-300 px-4 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition';
            });
            btn.className = 'cat-pill active bg-rose-600 text-white px-4 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap shadow transition';

            if (cat === 'all') {
                renderVideos(allLoadedVideos);
            } else {
                renderVideos(allLoadedVideos.filter(v => (v.category || '').toLowerCase() === cat.toLowerCase()));
            }
        }

        function refreshFeed() {
            fetchVideos(true);
        }

        // Fast Init
        loadAdLink();
        fetchVideos(true);
    </script>
</body>
</html>
