<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Viral Story - MiniHub Blog</title>
    
    <!-- Neon Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23e11d48'/%3E%3Cstop offset='100%25' stop-color='%23ff0055'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='25' fill='url(%23g)'/%3E%3Cpolygon points='38,28 75,50 38,72' fill='%23ffffff'/%3E%3C/svg%3E">

    <!-- SEO Meta Tags -->
    <meta id="metaDesc" name="description" content="Read full article on MiniHub Stories.">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <meta name="rating" content="RTA-5042-1996-1400-1579-1604-AVG">
    <meta name="rating" content="adult">

    <!-- Open Graph Dynamic -->
    <meta property="og:type" content="article">
    <meta id="ogTitle" property="og:title" content="MiniHub Story">
    <meta id="ogDesc" property="og:description" content="Explore viral full uncensored story.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS with Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            font-family: 'Hind Siliguri', 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .theme-transition {
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-[#050508] dark:text-gray-100 theme-transition pb-24">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-white/90 dark:bg-[#050508]/90 backdrop-blur-xl border-b border-gray-200 dark:border-[#171a24] px-3.5 lg:px-10 py-2.5 theme-transition">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-rose-600 flex items-center justify-center shadow-lg shadow-rose-600/30">
                    <svg class="w-4 h-4 text-white ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <span class="text-xl font-black">MINI<span class="text-rose-600">HUB</span></span>
            </a>

            <div class="flex items-center gap-2">
                <a href="blog.html" class="text-xs font-bold bg-gray-200 dark:bg-[#0e111a] hover:bg-gray-300 dark:hover:bg-[#151926] border border-gray-300 dark:border-[#1b1f2e] text-gray-800 dark:text-gray-300 px-3.5 py-1.5 rounded-xl transition">
                    ← All Stories
                </a>
            </div>
        </div>
    </header>

    <!-- Main Article Body -->
    <main class="max-w-3xl mx-auto px-4 mt-6 space-y-6">
        
        <!-- Category & Date Meta -->
        <div class="flex items-center gap-2.5 text-xs">
            <span id="artCategory" class="bg-rose-600/20 text-rose-500 border border-rose-500/30 px-3 py-0.5 rounded-full font-bold uppercase tracking-wider">
                Viral Story
            </span>
            <span class="text-gray-400" id="artDate">Today</span>
            <span class="text-gray-400">&bull;</span>
            <span class="text-gray-400">👁️ <span id="artViews">0</span> Views</span>
        </div>

        <!-- Headline -->
        <h1 id="artTitle" class="text-2xl sm:text-3xl font-black text-gray-900 dark:text-white leading-tight">
            Loading Article...
        </h1>

        <!-- Featured Image -->
        <div id="artImageWrap" class="w-full aspect-[16/9] bg-black rounded-3xl overflow-hidden border border-gray-200 dark:border-[#171a24] shadow-2xl relative">
            <img id="artImage" src="" alt="Story Scene" class="w-full h-full object-cover">
        </div>

        <!-- ========================================== -->
        <!-- লাইভ HTML বডি (যেখানে সব HTML, ভিডিও ও অ্যাড কাজ করবে) -->
        <!-- ========================================== -->
        <article id="artContent" class="bg-white dark:bg-[#0c0e14] border border-gray-200 dark:border-[#171a24] p-5 sm:p-8 rounded-3xl space-y-4 text-gray-800 dark:text-gray-200 text-sm sm:text-base leading-relaxed shadow-sm">
            লোড হচ্ছে...
        </article>

        <!-- Viral Share Bar -->
        <div class="flex items-center justify-between p-4 rounded-2xl bg-white dark:bg-[#0c0e14] border border-gray-200 dark:border-[#171a24]">
            <span class="text-xs font-bold text-gray-500">এই খবরটি শেয়ার করুন:</span>
            <button onclick="handleViralShareArticle()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-extrabold px-6 py-2 rounded-xl transition shadow flex items-center gap-1.5">
                <span>🚀 Share Story</span>
            </button>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-rose-600 text-white text-xs font-bold px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50">
        Copied!
    </div>

    <script>
        // Obfuscated Supabase Connection
        const _k0 = "aHR0cHM6Ly9hcGV1dXpoZmpxcm1yZXN1b3JsdS5zdXBhYmFzZS5jbw==";
        const _k1 = "c2JfcHVibGlzaGFibGVfN3lBUG52MW94Z3prMzNyTFhMTFZmQV9oZ0I3N28yaQ==";
        const _ad0 = "aHR0cHM6Ly93d3cucHJvZml0YWJsZXJhdGVjcG1uZXR3b3JrLmNvbS9tYXVyaTZlMWY3P2tleT0zZjBmZDc0YzlmM2JmNTRlNjI2YzQ2ZjU3ZjAwMTQ3Nw==";

        const _d = (s) => atob(s);
        const supabaseClient = window.supabase.createClient(_d(_k0), _d(_k1));

        const articleId = parseInt(new URLSearchParams(window.location.search).get('id'));
        let currentArticle = null;
        let dynamicAdLink = _d(_ad0);

        // Anti-Inspect Security
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c'))) e.preventDefault();
        });

        // Schema Injector
        function injectBlogSchema(article) {
            const schemaData = {
                "@context": "https://schema.org",
                "@type": "BlogPosting",
                "headline": article.title,
                "image": [article.featured_image || "https://minihub-cinema.kstridoy013.workers.dev/favicon.ico"],
                "datePublished": article.created_at,
                "author": { "@type": "Person", "name": "MiniHub Editorial" },
                "publisher": { "@type": "Organization", "name": "MiniHub" }
            };
            const scriptTag = document.createElement('script');
            scriptTag.type = 'application/ld+json';
            scriptTag.text = JSON.stringify(schemaData);
            document.head.appendChild(scriptTag);
        }

        async function loadArticle() {
            if (!articleId) { window.location.href = 'blog.html'; return; }

            try {
                // Fetch dynamic ad link
                const { data: adData } = await supabaseClient.from('site_settings').select('value').eq('key', 'adsterra_link').single();
                if (adData && adData.value) dynamicAdLink = adData.value;
            } catch(e) {}

            try {
                const { data, error } = await supabaseClient.from('blogs').select('*').eq('id', articleId).single();
                if (error || !data) throw new Error("Article not found");
                currentArticle = data;

                document.title = `${currentArticle.title} - MiniHub Blog`;
                document.getElementById('artTitle').innerText = currentArticle.title;
                document.getElementById('artCategory').innerText = currentArticle.category || 'Viral Story';
                document.getElementById('artViews').innerText = (currentArticle.views || 0) + 1;
                document.getElementById('artDate').innerText = new Date(currentArticle.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                
                // 🔥 আসল পরিবর্তন: innerHTML দিয়ে রেন্ডার হচ্ছে, ফলে সব HTML কোড জীবন্ত কাজ করবে!
                document.getElementById('artContent').innerHTML = currentArticle.content;

                if (currentArticle.featured_image && currentArticle.featured_image.trim() !== '') {
                    document.getElementById('artImage').src = currentArticle.featured_image;
                } else {
                    document.getElementById('artImageWrap').classList.add('hidden');
                }

                injectBlogSchema(currentArticle);
                supabaseClient.rpc('increment_blog_view', { blog_id: articleId }).then();

            } catch(err) {
                document.getElementById('artTitle').innerText = "Article not found!";
            }
        }

        function openAdLink() {
            window.open(dynamicAdLink, '_blank');
        }

        async function handleViralShareArticle() {
            const shareUrl = window.location.href;
            const msg = `🔥 ${currentArticle ? currentArticle.title : 'Shocking Story'} 😱👇\n${shareUrl}\n\nRead full report before it gets deleted! 🔞`;
            if (navigator.share) {
                try { await navigator.share({ title: document.title, text: msg, url: shareUrl }); } catch(e) {}
            } else {
                navigator.clipboard.writeText(msg);
                const toast = document.getElementById('toast');
                toast.innerText = "লিঙ্ক কপি হয়েছে!";
                toast.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2500);
            }
        }

        loadArticle();
    </script>
</body>
</html>
